# Structure-only config template. Every value is a ${VAR} placeholder expanded
# by configx (WithExpandEnv) from the process environment at startup; see
# .env.example for the actual values. To override a value, set the env var in
# .env (local) or the container/deployment env — never hard-code values here.
#
# configx loads ./config.yaml (NOT this file). `make run` copies this template
# to config.yaml automatically when missing; for docker, the renderer copies it
# into the image as /app/config.yaml.

server:
  grpc_addr: ${DEMO_SERVICE_SERVER_GRPC_ADDR}
  http_addr: ${DEMO_SERVICE_SERVER_HTTP_ADDR}

database:
  host: ${DEMO_SERVICE_DATABASE_HOST}
  port: ${DEMO_SERVICE_DATABASE_PORT}
  user: ${DEMO_SERVICE_DATABASE_USER}
  password: ${DEMO_SERVICE_DATABASE_PASSWORD}
  dbname: ${DEMO_SERVICE_DATABASE_DBNAME}
  sslmode: ${DEMO_SERVICE_DATABASE_SSLMODE}
  max_open_conns: ${DEMO_SERVICE_DATABASE_MAX_OPEN_CONNS}
  max_idle_conns: ${DEMO_SERVICE_DATABASE_MAX_IDLE_CONNS}
  conn_max_lifetime: ${DEMO_SERVICE_DATABASE_CONN_MAX_LIFETIME}

third_party:
  demo:
    mode: ${DEMO_SERVICE_THIRD_PARTY_DEMO_MODE}
    target: ${DEMO_SERVICE_THIRD_PARTY_DEMO_TARGET}
    config:
      prefix: ${DEMO_SERVICE_THIRD_PARTY_DEMO_CONFIG_PREFIX}
      max_input_len: ${DEMO_SERVICE_THIRD_PARTY_DEMO_CONFIG_MAX_INPUT_LEN}

cron:
  timezone: ${DEMO_SERVICE_CRON_TIMEZONE}

log:
  level: ${DEMO_SERVICE_LOG_LEVEL}
  format: ${DEMO_SERVICE_LOG_FORMAT}
