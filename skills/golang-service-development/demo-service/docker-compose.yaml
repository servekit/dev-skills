# Generated by golang-service-docker. Edit the skill inputs and rerender
# instead of hand-merging dependency files.

services:
  demo-service:
    image: ${IMAGE_REPOSITORY:-demo-service}:${IMAGE_TAG:-latest}
    build:
      context: "."
      dockerfile: "Dockerfile"
      # Override GOPROXY in .env (e.g. GOPROXY=https://goproxy.cn,direct) when
      # proxy.golang.org is unreachable from the build host.
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      - DEMO_SERVICE_SERVER_GRPC_ADDR=${DEMO_SERVICE_SERVER_GRPC_ADDR:-:9000}
      - DEMO_SERVICE_SERVER_HTTP_ADDR=${DEMO_SERVICE_SERVER_HTTP_ADDR:-:8080}
      - DEMO_SERVICE_LOG_LEVEL=${DEMO_SERVICE_LOG_LEVEL:-info}
      - DEMO_SERVICE_DATABASE_HOST=${DEMO_SERVICE_DATABASE_HOST:-postgres}
      - DEMO_SERVICE_DATABASE_PORT=${DEMO_SERVICE_DATABASE_PORT:-5432}
      - DEMO_SERVICE_DATABASE_USER=${DEMO_SERVICE_DATABASE_USER:-postgres}
      - DEMO_SERVICE_DATABASE_PASSWORD=${DEMO_SERVICE_DATABASE_PASSWORD:-postgres}
      - DEMO_SERVICE_DATABASE_DBNAME=${DEMO_SERVICE_DATABASE_DBNAME:-demo_service}
      - DEMO_SERVICE_DATABASE_SSLMODE=${DEMO_SERVICE_DATABASE_SSLMODE:-disable}
      - DEMO_SERVICE_CRON_TIMEZONE=${DEMO_SERVICE_CRON_TIMEZONE:-Asia/Shanghai}
      - DEMO_SERVICE_DATABASE_CONN_MAX_LIFETIME=${DEMO_SERVICE_DATABASE_CONN_MAX_LIFETIME:-5m}
      - DEMO_SERVICE_DATABASE_MAX_IDLE_CONNS=${DEMO_SERVICE_DATABASE_MAX_IDLE_CONNS:-10}
      - DEMO_SERVICE_DATABASE_MAX_OPEN_CONNS=${DEMO_SERVICE_DATABASE_MAX_OPEN_CONNS:-25}
      - DEMO_SERVICE_LOG_FORMAT=${DEMO_SERVICE_LOG_FORMAT:-json}
      - DEMO_SERVICE_THIRD_PARTY_DEMO_CONFIG_MAX_INPUT_LEN=${DEMO_SERVICE_THIRD_PARTY_DEMO_CONFIG_MAX_INPUT_LEN:-1024}
      - DEMO_SERVICE_THIRD_PARTY_DEMO_CONFIG_PREFIX=${DEMO_SERVICE_THIRD_PARTY_DEMO_CONFIG_PREFIX:-[demo]}
      - DEMO_SERVICE_THIRD_PARTY_DEMO_MODE=${DEMO_SERVICE_THIRD_PARTY_DEMO_MODE:-module}
      - DEMO_SERVICE_THIRD_PARTY_DEMO_TARGET=${DEMO_SERVICE_THIRD_PARTY_DEMO_TARGET:-}
      - VAR=${VAR:-}
    ports:
      - "${HOST_GRPC_PORT:-9000}:9000"
      - "${HOST_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:9000", "-connect-timeout=2s"]
      interval: ${HEALTHCHECK_INTERVAL:-10s}
      timeout: ${HEALTHCHECK_TIMEOUT:-3s}
      retries: ${HEALTHCHECK_RETRIES:-6}
      start_period: ${HEALTHCHECK_START_PERIOD:-10s}

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      - POSTGRES_DB=${DEMO_SERVICE_DATABASE_DBNAME:-demo_service}
      - POSTGRES_USER=${DEMO_SERVICE_DATABASE_USER:-postgres}
      - POSTGRES_PASSWORD=${DEMO_SERVICE_DATABASE_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEMO_SERVICE_DATABASE_USER:-postgres}"]
      interval: ${POSTGRES_HEALTHCHECK_INTERVAL:-3s}
      timeout: ${POSTGRES_HEALTHCHECK_TIMEOUT:-3s}
      retries: ${POSTGRES_HEALTHCHECK_RETRIES:-20}
      start_period: ${POSTGRES_HEALTHCHECK_START_PERIOD:-10s}



volumes:
  pgdata:
    name: ${POSTGRES_VOLUME:-demo-service-pgdata}
